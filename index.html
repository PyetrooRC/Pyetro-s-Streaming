<!DOCTYPE html>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="3; url=https://speech-claire-publication-reel.trycloudflare.com">
<title>Pyetro's Streaming</title>
<a id="l" href="https://speech-claire-publication-reel.trycloudflare.com">Pyetro's Streaming</a>
<script>
var reserva = "https://speech-claire-publication-reel.trycloudflare.com";
// Limpa o que este site tiver guardado antes de resolver o destino.
try { if (window.caches) caches.keys().then(function (ks) {
  ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
fetch("destino.txt?_=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.ok ? r.text() : reserva; })
  .catch(function () { return reserva; })
  .then(function (u) {
    u = (u || reserva).trim();
    if (!/^https?:\/\//.test(u)) u = reserva;
    document.getElementById("l").href = u;
    location.replace(u);
  });
</script>
