<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pyetro's Streaming</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 0%, #1b1033 0%, #0a0a0f 60%);
    color: #f4f4f7;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    text-align: center; padding: 24px;
  }
  .mark {
    font-size: clamp(56px, 16vw, 108px); font-weight: 800; letter-spacing: -.06em;
    background: linear-gradient(135deg, #f5c542, #e8543f 55%, #a855f7);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  h1 { font-size: 15px; letter-spacing: .34em; text-transform: uppercase;
       font-weight: 600; color: #b9b9c9; margin: 18px 0 6px; }
  p { color: #7b7b8c; font-size: 14px; margin: 6px 0 22px; }
  .bar { width: min(280px, 80vw); height: 3px; border-radius: 3px;
         background: #26263a; overflow: hidden; margin: 0 auto 24px; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 3px;
           background: linear-gradient(90deg, #f5c542, #e8543f);
           animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); }
                     100% { transform: translateX(250%); } }
  a { color: #f5c542; font-size: 13px; text-decoration: none;
      border-bottom: 1px solid rgba(245,197,66,.35); padding-bottom: 2px; }
  .off { display: none; color: #e8543f; font-size: 14px; }
</style>
</head>
<body>
  <main>
    <div class="mark">PS</div>
    <h1>Pyetro's Streaming</h1>
    <p id="msg">Conectando ao servidor…</p>
    <div class="bar"><i></i></div>
    <a id="link" href="#">Abrir manualmente</a>
    <p class="off" id="off">O servidor está desligado no momento.</p>
  </main>
<script>
  const DESTINO = "https://exemplo-teste.ngrok-free.app";
  const link = document.getElementById("link");
  if (DESTINO) {
    link.href = DESTINO;
    // Pequeno atraso: o navegador precisa pintar a marca antes de sair.
    setTimeout(() => location.replace(DESTINO), 550);
  } else {
    document.getElementById("msg").textContent = "Nenhum endereço publicado.";
    document.getElementById("off").style.display = "block";
    link.style.display = "none";
  }
</script>
</body>
</html>
